name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build Debug APK
        run: |
          # 1. Tìm thư mục chứa settings.gradle.kts nếu bị nằm trong thư mục con
          PROJECT_DIR=$(find . -name "settings.gradle.kts" -exec dirname {} \; | head -n 1)
          if [ -n "$PROJECT_DIR" ]; then
            echo "Found project at: $PROJECT_DIR"
            cd "$PROJECT_DIR"
          fi

          # 2. Tạo gradlew nếu chưa có trong repo
          if [ ! -f "./gradlew" ]; then
            echo "gradlew not found, generating wrapper..."
            gradle wrapper || true
          fi

          # 3. Chạy build APK
          if [ -f "./gradlew" ]; then
            chmod +x gradlew
            ./gradlew assembleDebug --stacktrace
          else
            gradle assembleDebug --stacktrace
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: HabitTap-app-debug
          path: '**/build/outputs/apk/**/*.apk'
